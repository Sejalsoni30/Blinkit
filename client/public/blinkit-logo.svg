<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="blinkitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#blinkitGrad)" filter="url(#shadow)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="#D97706" stroke-width="1.5" stroke-opacity="0.3"/>
  <!-- Signature Bold Lowercase 'b' -->
  <text x="28" y="48" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="42" text-anchor="middle" fill="#0F172A">b</text>
  <!-- Quick Commerce Green Dot Accent -->
  <circle cx="44" cy="20" r="5.5" fill="#0C831F"/>
  <circle cx="44" cy="20" r="2.5" fill="#34D399"/>
</svg>